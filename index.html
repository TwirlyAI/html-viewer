<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f0e5" />
    <title>TwirlyAI — HTML Viewer</title>
    <style>
      /* Field Notebook design: a tactile editorial folio—warm paper, ink-blue type,
         restrained Field Orange accents, thumb-reachable controls, and a document-first surface. */
      :root {
        --paper: #f5f0e5;
        --paper-deep: #e8e0d0;
        --ink: #17344a;
        --ink-soft: #5d6e7b;
        --orange: #d8662c;
        --orange-dark: #aa4820;
        --line: rgba(23, 52, 74, 0.14);
        --shadow: 0 14px 45px rgba(28, 43, 53, 0.12);
        --safe-bottom: max(18px, env(safe-area-inset-bottom));
        --safe-top: max(18px, env(safe-area-inset-top));
      }

      * { box-sizing: border-box; }
      html { background: var(--paper); }
      body {
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background-color: var(--paper);
        background-image:
          linear-gradient(rgba(23, 52, 74, 0.035) 1px, transparent 1px),
          radial-gradient(circle at 16% 2%, rgba(216, 102, 44, 0.09), transparent 26rem);
        background-size: 100% 29px, auto;
        font-family: -apple-system, BlinkMacSystemFont, "DM Sans", "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
      }
      button, input { font: inherit; }
      button { color: inherit; }
      svg { display: block; }

      .app-shell {
        display: flex;
        flex-direction: column;
        width: min(100%, 1480px);
        height: 100dvh;
        height: 100vh; /* fallback for browsers without dvh */
        margin: 0 auto;
        padding: var(--safe-top) clamp(16px, 3vw, 40px) var(--safe-bottom);
      }
      .masthead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        min-height: 58px;
        flex: 0 0 auto;
        margin: 0 0 clamp(10px, 2vw, 20px);
      }
      .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
      .brand-mark {
        width: 48px;
        height: 48px;
        flex: 0 0 auto;
        border-radius: 0;
        object-fit: contain;
        filter: drop-shadow(0 5px 8px rgba(23, 52, 74, 0.18));
      }
      .brand-copy { min-width: 0; }
      .eyebrow {
        margin: 0 0 3px;
        color: var(--orange-dark);
        font-size: 0.66rem;
        font-weight: 800;
        letter-spacing: 0.13em;
        line-height: 1;
        text-transform: uppercase;
      }
      .wordmark {
        margin: 0;
        color: var(--ink);
        font-family: "DM Serif Display", Georgia, ui-serif, serif;
        font-size: clamp(1.25rem, 3.5vw, 1.7rem);
        font-weight: 400;
        letter-spacing: 0.09em;
        line-height: 1;
        text-transform: uppercase;
      }
      .privacy-stamp {
        display: flex;
        align-items: center;
        gap: 7px;
        flex: 0 0 auto;
        color: var(--ink-soft);
        font-size: 0.76rem;
        font-weight: 650;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }
      .privacy-stamp svg { width: 16px; height: 16px; color: var(--orange); }

      .folio-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr);
        gap: clamp(16px, 2.3vw, 28px);
        align-items: stretch;
        flex: 1 1 auto;
        min-height: 0;
      }
      .viewer-shell {
        position: relative;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        border: 1px solid rgba(23, 52, 74, 0.13);
        border-radius: 0;
        background: #fffdf8;
        box-shadow: var(--shadow);
      }
      .viewer-shell::before {
        position: absolute;
        z-index: 3;
        top: 0;
        left: 0;
        width: 7px;
        height: 100%;
        content: "";
        background: var(--orange);
        opacity: 0;
        transition: opacity 180ms cubic-bezier(0.23, 1, 0.32, 1);
        pointer-events: none;
      }
      .viewer-shell.is-loaded::before { opacity: 1; }
      .viewer-shell::after {
        position: absolute;
        z-index: 4;
        top: 0;
        right: 0;
        width: 48px;
        height: 48px;
        content: "";
        border-bottom: 1px solid rgba(23, 52, 74, 0.2);
        border-left: 1px solid rgba(23, 52, 74, 0.2);
        background: linear-gradient(135deg, transparent 49%, rgba(255, 253, 248, 0.98) 50%);
        pointer-events: none;
      }
      #htmlFrame {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
      }
      .empty-sheet {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: flex;
        align-items: stretch;
        padding: clamp(30px, 6vw, 70px);
        background: linear-gradient(135deg, rgba(255, 253, 248, 0.96), rgba(248, 242, 231, 0.92));
        text-align: left;
        transition: opacity 180ms cubic-bezier(0.23, 1, 0.32, 1), visibility 180ms linear;
      }
      .empty-sheet.is-hidden { visibility: hidden; opacity: 0; pointer-events: none; }
      .empty-sheet::before {
        position: absolute;
        top: 0;
        left: 28px;
        z-index: 1;
        padding: 9px 12px 8px;
        content: "DOCUMENT FOLIO  /  001";
        border-right: 1px solid rgba(23, 52, 74, 0.15);
        border-bottom: 1px solid rgba(23, 52, 74, 0.15);
        color: var(--orange-dark);
        background: rgba(255, 253, 248, 0.72);
        font-size: 0.61rem;
        font-weight: 800;
        letter-spacing: 0.12em;
      }
      .empty-sheet::after {
        position: absolute;
        right: 12%;
        bottom: 10%;
        width: 84px;
        height: 84px;
        content: "";
        border: 2px solid var(--orange);
        opacity: 0.54;
        transform: rotate(45deg);
        pointer-events: none;
      }
      .empty-content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        width: min(100%, 510px);
      }
      .document-glyph {
        position: relative;
        display: grid;
        width: 84px;
        height: 104px;
        place-items: center;
        margin: 0 0 23px;
        border: 2px solid var(--ink);
        border-radius: 5px;
        background: rgba(255, 253, 248, 0.82);
        box-shadow: 8px 8px 0 rgba(216, 102, 44, 0.17);
      }
      .document-glyph::after {
        position: absolute;
        top: -2px;
        right: -2px;
        width: 27px;
        height: 27px;
        content: "";
        border-bottom: 2px solid var(--ink);
        border-left: 2px solid var(--ink);
        background: var(--paper);
        clip-path: polygon(0 0, 100% 100%, 0 100%);
      }
      .document-glyph::before {
        position: absolute;
        right: -10px;
        bottom: 16px;
        width: 17px;
        height: 17px;
        z-index: 2;
        content: "";
        border: 2px solid var(--orange);
        background: var(--paper);
        transform: rotate(45deg);
      }
      .document-glyph svg { width: 33px; height: 33px; color: var(--orange); }
      h1 {
        max-width: 13ch;
        margin: 0 0 12px;
        font-family: "DM Serif Display", Georgia, ui-serif, serif;
        font-size: clamp(2rem, 4.4vw, 3.4rem);
        font-weight: 400;
        letter-spacing: -0.035em;
        line-height: 0.98;
      }
      .empty-content > p {
        max-width: 49ch;
        margin: 0;
        color: var(--ink-soft);
        font-size: clamp(0.95rem, 2vw, 1.05rem);
        line-height: 1.58;
      }
      .import-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        min-height: 52px;
        margin-top: 26px;
        padding: 0 21px;
        border: 1px solid var(--orange-dark);
        border-radius: 13px 5px 13px 5px;
        color: #fffaf4;
        background: var(--orange);
        box-shadow: 0 5px 0 var(--orange-dark), 0 11px 22px rgba(170, 72, 32, 0.2);
        font-weight: 750;
        line-height: 1;
        cursor: pointer;
        transition: transform 150ms cubic-bezier(0.23, 1, 0.32, 1), box-shadow 150ms cubic-bezier(0.23, 1, 0.32, 1), background 150ms ease-out;
      }
      .import-button:hover { background: #c85c27; }
      .import-button:active { transform: translateY(3px) scale(0.98); box-shadow: 0 2px 0 var(--orange-dark), 0 5px 12px rgba(170, 72, 32, 0.17); }
      .import-button svg { width: 18px; height: 18px; }

      .control-strip {
        position: sticky;
        bottom: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: clamp(16px, 2vw, 22px);
        padding: 11px;
        border: 1px solid rgba(23, 52, 74, 0.16);
        border-radius: 0;
        background: rgba(255, 253, 248, 0.93);
        box-shadow: 0 9px 27px rgba(23, 52, 74, 0.08);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }
      .control-group { display: flex; align-items: center; gap: 7px; min-width: 0; }
      .control-group + .control-group { padding-left: 10px; border-left: 1px solid var(--line); }
      .tool-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-width: 44px;
        min-height: 44px;
        padding: 0 12px;
        border: 1px solid transparent;
        border-radius: 0;
        color: var(--ink);
        background: transparent;
        font-size: 0.84rem;
        font-weight: 730;
        cursor: pointer;
        transition: transform 150ms cubic-bezier(0.23, 1, 0.32, 1), background 150ms ease-out, border-color 150ms ease-out, color 150ms ease-out;
      }
      .tool-button svg { width: 18px; height: 18px; }
      .tool-button:hover:not(:disabled) { border-color: var(--line); background: rgba(23, 52, 74, 0.055); }
      .tool-button:active:not(:disabled) { transform: scale(0.97); }
      .tool-button:disabled { opacity: 0.38; cursor: not-allowed; }
      .tool-button.primary { color: #fffaf4; background: var(--ink); box-shadow: 0 3px 0 #0b1c28; }
      .tool-button.primary:hover { background: #214862; }
      .tool-button.primary:active { transform: translateY(2px) scale(0.98); box-shadow: 0 1px 0 #0b1c28; }
      .tool-label { display: inline; }

      .notice {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        max-width: 760px;
        margin: 14px auto 0;
        color: var(--ink-soft);
        font-size: 0.77rem;
        line-height: 1.45;
      }
      .notice svg { width: 16px; height: 16px; flex: 0 0 auto; margin-top: 2px; color: var(--orange); }
      .notice strong { color: var(--ink); }
      #fileInput { position: fixed; top: -100px; left: -100px; opacity: 0; pointer-events: none; }

      @media (max-width: 790px) {
        .folio-grid { grid-template-columns: 1fr; }
      }
      @media (max-width: 510px) {
        .app-shell { padding-right: 14px; padding-left: 14px; }
        .masthead { min-height: 46px; margin-bottom: 10px; }
        .brand-mark { width: 36px; height: 36px; }
        .privacy-stamp span { display: none; }
        .viewer-shell { border-radius: 0; }
        .control-strip { position: relative; gap: 5px; padding: 8px; margin-top: 10px; }
        .control-group { gap: 3px; }
        .control-group + .control-group { padding-left: 4px; }
        .tool-button { min-width: 42px; min-height: 42px; padding: 0 10px; }
        .tool-label { display: none; }
        .tool-button.primary .tool-label { display: inline; }
        .empty-sheet { padding: 22px; }
        .notice { display: none; }
      }
      .app-shell.is-focused .masthead,
      .app-shell.is-focused .notice {
        display: none;
      }
      .app-shell.is-focused .folio-grid {
        margin-top: 0;
      }
      #fullscreenButton .icon-exit { display: none; }
      #fullscreenButton.is-active .icon-enter { display: none; }
      #fullscreenButton.is-active .icon-exit { display: inline-flex; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 1ms !important; animation-duration: 1ms !important; }
      }
    </style>
  </head>

            <svg class="icon-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
            <svg class="icon-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 3v4a2 2 0 0 1-2 2H3"/><path d="M15 3v4a2 2 0 0 0 2 2h4"/><path d="M9 21v-4a2 2 0 0 0-2-2H3"/><path d="M15 21v-4a2 2 0 0 1 2-2h4"/></svg>
            <span class="tool-label" id="fullscreenLabel">Focus</span>
          </button>
        </div>
        <div class="control-group">
          <button class="tool-button" type="button" id="downloadButton" title="Download original file" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
            <span class="tool-label">Save</span>
          </button>
        </div>
      </nav>

      <p class="notice">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg>
        <span><strong>TwirlyAI.com</strong>.</span>
      </p>
      <input id="fileInput" type="file" accept=".html,.htm,text/html" aria-label="Choose an HTML file" />
    </main>

    <script>
      /* Field Notebook behavior: direct, reversible actions; user HTML remains in a sandboxed frame. */
      (() => {
        const frame = document.getElementById('htmlFrame');
        const viewerShell = document.getElementById('viewerShell');
        const emptySheet = document.getElementById('emptySheet');
        const fileInput = document.getElementById('fileInput');
        const controls = ['reloadButton', 'fullscreenButton', 'downloadButton'].map((id) => document.getElementById(id));
        let activeFile = null;
        let activeHTML = '';

        function injectViewerBridge(source) {
          const bridge = '<script>window.addEventListener("message",function(e){if(e.data&&e.data.__fieldNotebookAction==="print"){try{window.print()}catch(_){}}});<\\/script>';
          const viewport = '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">';
          let output = source;
          if (!/<meta[^>]+name=["\']viewport["\']/i.test(output)) {
            output = /<head[^>]*>/i.test(output) ? output.replace(/<head([^>]*)>/i, `<head$1>${viewport}`) : `${viewport}${output}`;
          }
          return /<\/body\s*>/i.test(output) ? output.replace(/<\/body\s*>/i, `${bridge}</body>`) : `${output}${bridge}`;
        }

        function renderDocument() {
          if (!activeHTML) return;
          frame.srcdoc = injectViewerBridge(activeHTML);
        }

        function selectFile() {
          fileInput.value = '';
          fileInput.click();
        }

        async function loadFile(file) {
          if (!file) return;
          const accepted = file.name.toLowerCase().endsWith('.html') || file.name.toLowerCase().endsWith('.htm') || file.type === 'text/html';
          if (!accepted) return;
          try {
            activeFile = file;
            activeHTML = await file.text();
            controls.forEach((button) => { button.disabled = false; });
            emptySheet.classList.add('is-hidden');
            viewerShell.classList.add('is-loaded');
            renderDocument();
          } catch (error) {
            console.error(error);
          }
        }

        document.getElementById('openButton').addEventListener('click', selectFile);
        document.getElementById('emptyImportButton').addEventListener('click', selectFile);
        fileInput.addEventListener('change', (event) => loadFile(event.target.files && event.target.files[0]));
        document.getElementById('reloadButton').addEventListener('click', renderDocument);
        const appShell = document.getElementById('appShell');
        const fullscreenButton = document.getElementById('fullscreenButton');
        const fullscreenLabel = document.getElementById('fullscreenLabel');
        function setFocusMode(active) {
          appShell.classList.toggle('is-focused', active);
          fullscreenButton.classList.toggle('is-active', active);
          fullscreenButton.setAttribute('aria-pressed', String(active));
          fullscreenButton.title = active ? 'Exit focus' : 'Focus viewer';
          fullscreenLabel.textContent = active ? 'Exit' : 'Focus';
        }
        fullscreenButton.addEventListener('click', () => {
          setFocusMode(!appShell.classList.contains('is-focused'));
        });
        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape' && appShell.classList.contains('is-focused')) setFocusMode(false);
        });
        document.getElementById('downloadButton').addEventListener('click', () => {
          if (!activeFile) return;
          const link = document.createElement('a');
          link.href = URL.createObjectURL(activeFile);
          link.download = activeFile.name;
          link.click();
          setTimeout(() => URL.revokeObjectURL(link.href), 500);
        });
      })();
    </script>
  </body>
</html>
